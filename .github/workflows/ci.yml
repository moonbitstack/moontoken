name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: examples run
        if: runner.os == 'Linux'
        run: |
          for dir in src/examples/*/; do
            if grep -q 'kind: "executable"' "$dir/moon.pkg" && ! grep -q 'supported_targets = "js"' "$dir/moon.pkg"; then
              moon run "$dir" --target native > /dev/null
            fi
          done

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

      # A reader pastes the blocks of the README and the skills into a project, so they have
      # to compile as written, against this commit's source.
      - name: the code in the docs compiles
        if: runner.os == 'Linux'
        run: python3 scripts/check_snippets.py

  # The references this library is measured against. `build` answers whether the
  # code compiles and its own tests pass; this answers whether it agrees with
  # the implementation the format actually comes from. Two layers, because they
  # fail differently: the vectors catch a change to this library, and the live
  # differential catches a change to the reference.
  conformance:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: install the references, pinned
        run: |
          pip install --disable-pip-version-check \
            tiktoken==0.14.0 sentencepiece==0.2.3 tokenizers==0.23.1

      - name: build the program the comparisons drive
        run: |
          moon version --all
          moon update
          moon build --target native

      # A committed vector that no longer matches its reference is worse than no
      # vector at all, so the generator has to leave the tree alone. It does
      # here, on every platform CI runs: the corpus is written by the script and
      # the trainer is pinned to one thread, so the models are the same bytes.
      - name: the vectors still match the references
        run: |
          python scripts/gen_vectors.py
          git diff --exit-code

      - name: the references still agree, record by record
        run: python scripts/diff_reference.py --prepare
