name: Docs

on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      # The pages cut text with this library, compiled here; the JavaScript is a
      # build product, so it is not in the repository.
      - name: build the engine for the pages
        run: |
          moon update
          moon build --target js --release src/examples/browser
          mkdir -p docs/engine
          cp _build/js/release/build/examples/browser/browser.js docs/engine/moontoken.js

      - name: the reference page follows the code
        run: |
          python3 scripts/gen_api.py
          git diff --exit-code docs/api.html

      - name: configure pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v5
